<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon carnet de repas</title>
<meta name="theme-color" content="#F5F7F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet repas">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
:root{
  --ink:#2A1B3D; --muted:#6E6480; --bg:#F5F7F3; --card:#FFFFFF; --line:#E2E6DD;
  --viande:#D9482B; --viande-bg:#FDE9E3;
  --poisson:#1F7A9E; --poisson-bg:#E0F1F7;
  --vege:#4C9A2A; --vege-bg:#E6F3DD;
  --chip:#EFF1EB;
}
*{box-sizing:border-box;margin:0}
body{font-family:ui-rounded,"Avenir Next","Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;padding:calc(20px + env(safe-area-inset-top)) 16px calc(80px + env(safe-area-inset-bottom))}
.wrap{max-width:1000px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}
h1{font-size:clamp(30px,6vw,46px);line-height:1.05;letter-spacing:-.02em;font-weight:800}
h1 small{display:block;font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:6px}
h1 small.status{font-size:12px;margin-top:2px}
.btn{display:inline-block;text-decoration:none;font:inherit;font-weight:700;border:0;border-radius:999px;padding:11px 18px;cursor:pointer;background:var(--ink);color:#fff}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn:focus-visible,input:focus-visible,.pill:focus-visible,.chip:focus-visible{outline:3px solid #7B5CFF;outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.pick{display:none;background:var(--ink);color:#fff;border-radius:22px;padding:20px;margin-bottom:20px}
.pick.show{display:block;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.pick .emo{font-size:44px}
.pick h2{font-size:24px;margin:4px 0 8px}
.pick .chips .chip{background:rgba(255,255,255,.16);color:#fff}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
.search{flex:1 1 240px;font:inherit;padding:11px 16px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font:inherit;font-weight:700;font-size:14px;padding:9px 14px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.count{font-size:14px;color:var(--muted);margin:8px 2px 14px}
.active-ing{display:none;margin-bottom:12px;font-size:14px}
.active-ing.show{display:block}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.card{background:var(--card);border-radius:20px;padding:16px 16px 14px;border-left:8px solid var(--c);position:relative;box-shadow:0 1px 0 var(--line)}
.card.viande{--c:var(--viande)} .card.poisson{--c:var(--poisson)} .card.vege{--c:var(--vege)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.emo{font-size:32px;line-height:1;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--bgc);flex:none}
.viande .emo{--bgc:var(--viande-bg)} .poisson .emo{--bgc:var(--poisson-bg)} .vege .emo{--bgc:var(--vege-bg)}
.card h3{font-size:18px;line-height:1.2}
.tag{display:inline-block;font-size:12px;font-weight:700;margin-top:3px;color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff}
.del{position:absolute;top:8px;right:10px;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;opacity:.6;border-radius:8px;padding:2px 8px}
.del:hover,.del:focus-visible{opacity:1;color:var(--viande)}
.empty{grid-column:1/-1;text-align:center;padding:40px 10px;color:var(--muted)}

dialog{border:0;border-radius:24px;padding:22px;width:min(440px,92vw);color:var(--ink);box-shadow:0 20px 60px rgba(42,27,61,.35)}
dialog::backdrop{background:rgba(42,27,61,.45)}
dialog h2{margin-bottom:14px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
input.f{width:100%;font:inherit;padding:11px 14px;border-radius:14px;border:2px solid var(--line);color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.row{display:flex;gap:10px}.row>div:first-child{width:90px}.row>div:last-child{flex:1}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
#connection-check{margin-top:10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
button,input{touch-action:manipulation}
@media (pointer:coarse){.btn,.pill{min-height:44px}.chip{min-height:36px;padding:7px 12px}.del{min-width:44px;min-height:44px;opacity:1}}
@media (prefers-reduced-motion:reduce){.pick.show{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mon carnet de repas<small id="tagline"></small><small class="status" id="sub"></small></h1>
    <div class="actions">
      <button class="btn alt" id="rand">🎲 Idée au hasard</button>
      <button class="btn alt" id="add" type="button">＋ Ajouter un repas</button>
      <button class="btn" id="refresh">↻ Actualiser la liste</button>
    </div>
  </header>

  <section class="pick" id="pick" aria-live="polite"></section>

  <div class="tools">
    <input class="search" id="q" type="search" placeholder="Chercher un repas ou un ingrédient…" aria-label="Rechercher">
    <div class="pills" id="pills"></div>
  </div>
  <div class="active-ing" id="ai"></div>
  <p class="count" id="count"></p>
  <main class="grid" id="grid"></main>
</div>

<dialog id="dlg">
  <form id="meal-form" method="post" target="sheet-submit-frame">
    <input id="form-action" name="action" type="hidden" value="">
    <input id="form-request-id" name="requestId" type="hidden" value="">
    <input id="form-return-url" name="returnUrl" type="hidden" value="">
    <h2>Ajouter un repas</h2>
    <label for="fn">Nom du repas</label>
    <input class="f" id="fn" name="name" maxlength="100" placeholder="Ex. : Wok de crevettes" required>
    <div class="row">
      <div><label for="fe">Emoji</label><input class="f" id="fe" name="emoji" value="🍽️" maxlength="8" required></div>
    </div>
    <label for="fi">Ingrédients</label>
    <input class="f" id="fi" name="ingredients" maxlength="500" placeholder="Riz, carotte, crevette, poivron" required>
    <p class="hint">Sépare les ingrédients par des virgules. Le repas sera ajouté à la liste partagée.</p>
    <button class="btn alt" id="connection-check" type="button">Tester la connexion</button>
    <div class="foot">
      <button class="btn alt" id="cancel" type="button">Annuler</button>
      <button class="btn" id="save" type="submit">Valider</button>
    </div>
  </form>
</dialog>
<iframe id="sheet-submit-frame" name="sheet-submit-frame" title="Enregistrement du repas" hidden></iframe>
<div class="toast" id="toast" role="status"></div>

<script>
// ---------- Etat ----------
let meals=[], filter="all", query="", ingFilter=null;
const $=id=>document.getElementById(id);
const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vTqmAYifXa_rrVbNrSwUXEj-SOzrZUkQ6QI-vdvUtWSD48_NVS0V4p3vMQ8-sQ-gpMgPDlq7_FrKnXk/pub?gid=0&single=true&output=csv";
const SHEET_WRITE_URL="https://script.google.com/macros/s/AKfycbx01yml62gvryZ8YHsKKRpx6y3MVBMFPoQsWOwugJTwTzv9wTgbooRzDTYQk6QeI769/exec";
const CACHE_KEY="carnet-repas-sheet-cache-v1";
let sheetStatus="loading";
let pendingMeal=null, pendingTimeout=null, pendingAction="", pendingRequestId="", pendingBaselineCount=0, checkingSavedMeal=false;

const VIANDE=["steak","poulet","jambon","chorizo","saucisse","viande","carne"];
const POISSON=["poisson","sardine","crevette","saumon"];
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function cat(m){
  const t=norm(m.ing.join(" ")+" "+m.name);
  if(VIANDE.some(k=>t.includes(k)))return "viande";
  if(POISSON.some(k=>t.includes(k)))return "poisson";
  return "vege";
}
const LABEL={viande:"Viande",poisson:"Poisson",vege:"Végé"};

// ---------- Lecture de la feuille Google ----------
function parseCSV(text){
  const rows=[];let row=[],cell="",quoted=false;
  text=text.replace(/^\uFEFF/,"");
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(quoted){
      if(ch==='"'&&text[i+1]==='"'){cell+='"';i++;}
      else if(ch==='"')quoted=false;
      else cell+=ch;
    }else if(ch==='"')quoted=true;
    else if(ch===","){row.push(cell);cell="";}
    else if(ch==="\n"||ch==="\r"){
      if(ch==="\r"&&text[i+1]==="\n")i++;
      row.push(cell);cell="";
      if(row.some(value=>value.trim()))rows.push(row);
      row=[];
    }else cell+=ch;
  }
  if(cell||row.length){row.push(cell);if(row.some(value=>value.trim()))rows.push(row);}
  return rows;
}
function mealsFromCSV(text){
  const rows=parseCSV(text);
  if(!rows.length)return [];
  const headers=rows[0].map(value=>norm(value.trim()));
  const nameCol=headers.indexOf("nom"), emojiCol=headers.indexOf("emoji"), ingCol=headers.indexOf("ingredients");
  if(nameCol<0||emojiCol<0||ingCol<0)throw new Error("Colonnes attendues : Nom, Emoji, Ingrédients");
  return rows.slice(1).map((values,index)=>{
    const name=(values[nameCol]||"").trim();
    const ingredients=(values[ingCol]||"").split(/[;,]/).map(value=>value.trim()).filter(Boolean);
    if(!name||!ingredients.length)return null;
    return{id:"sheet-"+index+"-"+norm(name).replace(/[^a-z0-9]+/g,"-"),name,emoji:(values[emojiCol]||"🍽️").trim()||"🍽️",ing:ingredients};
  }).filter(Boolean);
}
async function loadSheet(){
  sheetStatus="loading";render();
  try{
    const response=await fetch(SHEET_URL,{cache:"no-store"});
    if(!response.ok)throw new Error("Réponse Google Sheets : "+response.status);
    const csv=await response.text();
    const sharedMeals=mealsFromCSV(csv);
    meals=sharedMeals;sheetStatus=sharedMeals.length?"ready":"empty";
    try{localStorage.setItem(CACHE_KEY,JSON.stringify(meals));}catch(e){}
  }catch(e){
    try{
      const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");
      if(Array.isArray(cached)){meals=cached;sheetStatus="offline";}
      else{meals=[];sheetStatus="error";}
    }catch(error){meals=[];sheetStatus="error";}
  }
  render();
}

// ---------- Rendu ----------
function chips(m,container){
  m.ing.forEach(i=>{
    const b=document.createElement("button");
    b.className="chip"+(ingFilter===i?" on":"");
    b.textContent=i;
    b.title="Voir tous les repas avec cet ingrédient";
    b.onclick=()=>{ingFilter=(ingFilter===i?null:i);render();window.scrollTo({top:0,behavior:"smooth"});};
    container.appendChild(b);
  });
}
function visible(){
  const q=norm(query.trim());
  return meals.filter(m=>{
    if(filter!=="all"&&cat(m)!==filter)return false;
    if(ingFilter&&!m.ing.includes(ingFilter))return false;
    if(q&&!norm(m.name+" "+m.ing.join(" ")).includes(q))return false;
    return true;
  });
}
function render(){
  const list=visible(), g=$("grid");
  g.innerHTML="";
  list.forEach(m=>{
    const c=cat(m), el=document.createElement("article");
    el.className="card "+c;
    el.innerHTML='<div class="top"><div class="emo"></div><div><h3></h3><span class="tag"></span></div></div><div class="chips"></div>';
    el.querySelector(".emo").textContent=m.emoji;
    el.querySelector("h3").textContent=m.name;
    el.querySelector(".tag").textContent=LABEL[c];
    chips(m,el.querySelector(".chips"));
    g.appendChild(el);
  });
  if(!list.length){
    const emptyText=sheetStatus==="loading"?"Chargement des repas…":sheetStatus==="empty"?"La feuille ne contient pas encore de repas. Ajoute-les dans Google Sheets puis actualise.":sheetStatus==="error"?"Impossible de charger la feuille. Vérifie ta connexion puis actualise.":query||ingFilter||filter!=="all"?"Aucun repas trouvé. Essaie un autre mot ou un autre filtre.":"La liste partagée ne contient aucun repas.";
    g.innerHTML='<p class="empty"></p>';g.querySelector(".empty").textContent=emptyText;
  }
  $("count").textContent=list.length+(list.length>1?" repas":" repas")+(list.length!==meals.length?" sur "+meals.length:"");
  $("tagline").textContent=meals.length?meals.length+" idées pour ne plus se demander quoi manger":"Des idées pour ne plus se demander quoi manger";
  const statusText={loading:"Chargement de la liste partagée…",ready:"",empty:"La feuille est vide",offline:"Hors ligne — dernière liste partagée enregistrée",error:"Feuille inaccessible"};
  $("sub").textContent=statusText[sheetStatus]||"";
  const ai=$("ai");
  if(ingFilter){ai.className="active-ing show";ai.innerHTML="";const b=document.createElement("button");b.className="pill";b.textContent="Ingrédient : "+ingFilter+"  ✕";b.onclick=()=>{ingFilter=null;render();};ai.appendChild(b);}
  else ai.className="active-ing";
}
function renderPills(){
  const p=$("pills");p.innerHTML="";
  [["all","Tous"],["viande","🥩 Viande"],["poisson","🐟 Poisson"],["vege","🌱 Végé"]].forEach(([k,l])=>{
    const b=document.createElement("button");b.className="pill";b.textContent=l;
    b.setAttribute("aria-pressed",filter===k);
    b.onclick=()=>{filter=k;renderPills();render();};
    p.appendChild(b);
  });
}

// ---------- Actions ----------
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2400);}
$("q").oninput=e=>{query=e.target.value;render();};
$("add").onclick=()=>{$("meal-form").reset();$("fe").value="🍽️";$("dlg").showModal();$("fn").focus();};
$("cancel").onclick=()=>$("dlg").close();
function startPendingTimeout(action){
  clearTimeout(pendingTimeout);
  pendingTimeout=setTimeout(()=>{
    if(pendingAction!==action)return;
    pendingAction="";pendingMeal=null;
    $("save").disabled=false;$("save").textContent="Valider";
    $("connection-check").disabled=false;$("connection-check").textContent="Tester la connexion";
    toast("Aucune réponse de Google. Vérifie le déploiement Apps Script et le compte Google connecté.");
  },20000);
}
function beginSheetRequest(action){
  pendingAction=action;pendingRequestId=String(Date.now())+Math.random().toString(36).slice(2);
  $("form-request-id").value=pendingRequestId;
  $("form-return-url").value=location.origin+location.pathname;
  $("form-action").value=action==="healthcheck"?"healthcheck":"";
}
function sameMeal(a,b){
  const ingredients=values=>values.map(value=>norm(value.trim())).filter(Boolean).sort().join("|");
  return norm(a.name.trim())===norm(b.name.trim())&&a.emoji.trim()===b.emoji.trim()&&ingredients(a.ing)===ingredients(b.ing);
}
function finishSavedMeal(){
  clearTimeout(pendingTimeout);pendingAction="";pendingRequestId="";pendingMeal=null;checkingSavedMeal=false;
  $("save").disabled=false;$("save").textContent="Valider";
  $("connection-check").disabled=false;$("connection-check").textContent="Tester la connexion";
  $("dlg").close();toast("Repas ajouté à la liste partagée 🎉");$("meal-form").reset();$("fe").value="🍽️";
  loadSheet();
}
async function confirmMealSaved(){
  if(checkingSavedMeal||pendingAction!=="add"||!pendingMeal)return;
  checkingSavedMeal=true;
  for(let attempt=0;attempt<8&&pendingAction==="add";attempt++){
    try{
      const separator=SHEET_URL.includes("?")?"&":"?";
      const response=await fetch(SHEET_URL+separator+"_="+Date.now(),{cache:"no-store"});
      if(response.ok){
        const latest=mealsFromCSV(await response.text());
        const matching=latest.filter(meal=>sameMeal(meal,pendingMeal)).length;
        if(matching>pendingBaselineCount){finishSavedMeal();return;}
      }
    }catch(e){}
    await new Promise(resolve=>setTimeout(resolve,1200));
  }
  checkingSavedMeal=false;
  if(pendingAction!=="add")return;
  clearTimeout(pendingTimeout);pendingAction="";pendingRequestId="";pendingMeal=null;
  $("save").disabled=false;$("save").textContent="Valider";
  $("connection-check").disabled=false;$("connection-check").textContent="Tester la connexion";
  toast("Le repas n’apparaît pas dans la liste partagée. Vérifie l’accès du compte Google à la feuille.");
}
$("connection-check").onclick=()=>{
  if(!SHEET_WRITE_URL){toast("La connexion d’enregistrement doit encore être configurée.");return;}
  const form=$("meal-form");pendingMeal=null;beginSheetRequest("healthcheck");form.action=SHEET_WRITE_URL;
  $("save").disabled=true;
  $("connection-check").disabled=true;$("connection-check").textContent="Test…";
  form.submit();startPendingTimeout("healthcheck");
};
$("meal-form").addEventListener("submit",event=>{
  event.preventDefault();
  if(!SHEET_WRITE_URL){toast("La connexion d’enregistrement doit encore être configurée.");return;}
  const name=$("fn").value.trim(), emoji=$("fe").value.trim(), ingredients=$("fi").value.split(",").map(value=>value.trim()).filter(Boolean);
  if(!name||!emoji||!ingredients.length){toast("Renseigne le nom, l’emoji et au moins un ingrédient.");return;}
  pendingMeal={id:"pending-"+Date.now(),name,emoji,ing:ingredients};
  pendingBaselineCount=meals.filter(meal=>sameMeal(meal,pendingMeal)).length;
  beginSheetRequest("add");
  const form=event.currentTarget;
  form.action=SHEET_WRITE_URL;
  $("connection-check").disabled=true;
  $("save").disabled=true;$("save").textContent="Envoi…";
  form.submit();
  startPendingTimeout("add");
});
function handleSheetResponse(data){
  if(!data||data.source!=="repas-sheet"||data.requestId!==pendingRequestId||!pendingAction)return;
  clearTimeout(pendingTimeout);
  $("save").disabled=false;$("save").textContent="Valider";
  $("connection-check").disabled=false;$("connection-check").textContent="Tester la connexion";
  if(pendingAction==="healthcheck"){
    pendingAction="";$("connection-check").disabled=false;$("connection-check").textContent="Tester la connexion";
    if(data.ok&&data.healthcheck)toast("Connexion et écriture vérifiées. Aucun repas de test conservé.");
    else toast(data.error||"Le test n’a pas abouti. Redéploie la dernière version Apps Script.");
    return;
  }
  pendingAction="";
  if(data.ok&&pendingMeal){
    meals.unshift(pendingMeal);pendingMeal=null;sheetStatus="ready";render();
    try{localStorage.setItem(CACHE_KEY,JSON.stringify(meals));}catch(e){}
    $("dlg").close();toast("Repas ajouté à la liste partagée 🎉");$("meal-form").reset();$("fe").value="🍽️";
  }else{pendingMeal=null;toast(data.error||"Impossible d’ajouter le repas. Vérifie que tu as accès à la feuille.");}
}
window.addEventListener("message",event=>handleSheetResponse(event.data));
$("sheet-submit-frame").addEventListener("load",()=>{
  try{
    const responseUrl=new URL($("sheet-submit-frame").contentWindow.location.href);
    if(responseUrl.origin===location.origin&&responseUrl.hash.startsWith("#sheet-result=")){
      const data=JSON.parse(decodeURIComponent(responseUrl.hash.slice("#sheet-result=".length)));
      if(data.ok&&data.requestId===pendingRequestId&&pendingAction==="add"){confirmMealSaved();return;}
      handleSheetResponse(data);return;
    }
  }catch(e){}
  if(pendingAction==="healthcheck"){
    handleSheetResponse({source:"repas-sheet",requestId:pendingRequestId,ok:true,healthcheck:true});
  }else if(pendingAction==="add")confirmMealSaved();
});
$("rand").onclick=()=>{
  const pool=visible().length?visible():meals;
  if(!pool.length){toast("La feuille ne contient aucun repas");return;}
  const m=pool[Math.floor(Math.random()*pool.length)];
  const p=$("pick");p.className="pick show";p.innerHTML='<div class="emo"></div><h2></h2><div class="chips"></div>';
  p.querySelector(".emo").textContent=m.emoji;
  p.querySelector("h2").textContent=m.name;
  m.ing.forEach(i=>{const s=document.createElement("span");s.className="chip";s.textContent=i;p.querySelector(".chips").appendChild(s);});
  p.scrollIntoView({behavior:"smooth",block:"nearest"});
};
$("refresh").onclick=()=>loadSheet();

// Affiche la liste de secours puis remplace-la par la feuille si elle contient des repas.
renderPills();render();
loadSheet();
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
